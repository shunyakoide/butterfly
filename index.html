<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wall Butterfly</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: rgba(255,255,255,.6); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
    /* The switches: a settings readout drawn over the frame, with no panel behind it. */
    /* Left-anchored, so a longer value grows to the right instead of shifting the rows. */
    #switches { position: fixed; left: 12px; bottom: 6px; display: grid; grid-template-columns: auto auto auto auto; column-gap: 10px;
      border-top: 1px solid rgba(255,255,255,.25); padding-top: 4px; }
    #switches button { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; background: none; border: 0; padding: 0; margin: 0; font: 11px/1 ui-monospace, monospace; letter-spacing: .08em; color: rgba(255,255,255,.55);
      text-shadow: 0 0 4px #000, 0 0 2px #000; cursor: pointer; }
    #switches button > * { display: flex; align-items: center; min-height: 26px; }
    #switches button:hover, #switches button:focus-visible { color: rgba(255,255,255,.95); }
    #switches button:focus-visible { outline: 1px solid rgba(255,255,255,.6); outline-offset: 2px; }
    #switches kbd { font: inherit; opacity: .6; }
    #switches i { gap: 3px; }
    #switches u { width: 5px; height: 5px; border: 1px solid currentColor; box-sizing: border-box; }
    #switches u.on { background: rgba(255,255,255,.95); border-color: rgba(255,255,255,.95); }
    #switches b { font-weight: normal; color: rgba(255,255,255,.95); min-width: 8ch; }
    /* No keys on a touch screen, and fingers need taller rows. */
    @media (pointer: coarse) { #switches kbd { display: none; } #switches { grid-template-columns: auto auto auto; }
      #switches button > * { min-height: 40px; } }  </style>
</head>
<body>
  <div id="hud">読み込み中…</div>
  <nav id="switches" aria-label="表示の切り替え"></nav>
  <script type="module" src="/main.js"></script>
</body>
</html>
